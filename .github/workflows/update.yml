name: Update profile card

on:
  schedule:
    - cron: "37 22 * * *"      # every day 06:37 Taipei (after the paper library run)
  push:
    branches: [main]
    paths:                     # the private repos published new numbers
      - "data/ai-summary.json"
      - "data/papers-summary.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github.py "${{ github.repository_owner }}" data/github.json
      - run: python3 scripts/build_profile.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/github.json README.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -qm "profile: update $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase origin main; done
          exit 1
